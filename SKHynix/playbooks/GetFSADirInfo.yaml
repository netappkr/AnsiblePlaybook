---
- name: Ontap File Lifecycle Managed
  hosts: task_server_1_DLC
  gather_facts: no
  collections:
    - netapp.ontap
  tasks:
    - name: Get rest data information
      na_ontap_rest_info:
        hostname: "{{ cluster.ip }}"
        username: "{{ cluster.ID }}"
        password: "{{ cluster.PW }}"
        https: true
        validate_certs: false
        gather_subset:
          - volume_info
        fields:
          - 'svm.name'
          - 'nas'
          - 'name'
          - 'comment'
          - 'analytics'
          - 'uuid'
      register: ontap_volumes
      loop: "{{ clusters }}"
      loop_control:
        loop_var: cluster

    - name: Write result data to a JSON file
      copy:
        dest: "/tmp/volume_path_info.json"
        content: "{{ ontap_volumes.results | to_nice_json }}"
      register: datafile

    - name: Write result data to a config file
      copy:
        dest: "/tmp/config.yaml"
        content: "{{ DLC | to_nice_yaml }}"
      register: config

    - name: Search for 'script' in all directories
      find:
        paths: "{{ scripts_dir }}"
        patterns: "ScanVolumeList.py"
        recurse: yes
        file_type: file
      register: files_matched

    - name: Print the matched files
      debug:
        msg: "{{ files_matched.files[0].path }}"

    - name: Generate FLM list
      command: "python3 {{ files_matched.files[0].path }} -r get_scan_object --config {{ config.dest }} -f {{ datafile.dest }}"
      register: volume_list

    - name: Display volume_list
      debug:
        msg: "{{ volume_list.stdout }}"
      register: config_mapping

    - name: mkdir
      shell: |
        mkdir -p /data/vine/Ansible_XCP/FSA_result/{{division.name}}/{{ now(utc=false,fmt='%Y%m%d') }}/result
        mkdir -p /data/vine/Ansible_XCP/FSA_result/{{division.name}}/{{ now(utc=false,fmt='%Y%m%d') }}/info
        mkdir -p /data/vine/Ansible_XCP/FSA_result/{{division.name}}/{{ now(utc=false,fmt='%Y%m%d') }}/replace
      ignore_errors: true
      loop: "{{ DLC.config.division }}"
      loop_control:
        loop_var: division

    - name: Call ONTAP REST API for FSA
      uri:
        url: "https://{{ cluster.ip }}/api/storage/volumes/{{ volume_uuid }}/files?return_metadata=true"
        method: GET
        user: "{{ ontap_user }}"
        password: "{{ ontap_pass }}"
        validate_certs: false
        force_basic_auth: yes
      register: fsa_result

    - name: Search for 'project' in all directories
      find:
        paths: "{{ scripts_dir }}"
        patterns: "DLCXcpscan.j2"
        recurse: yes
        file_type: file
      register: files_matched

    - name: Print the matched files
      debug:
        msg: "{{ files_matched.files[0].path }}"


    - name: write result.yaml using jinia2
      template:
        src: DLCXcpscan.j2
        dest: /tmp/scan_list_file_results.yaml

      
