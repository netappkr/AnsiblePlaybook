---
- name: Ontap File Lifecycle Managed (FSA v2)
  hosts: task_server_1_fsa
  gather_facts: no
  collections:
    - netapp.ontap

  vars:
    work_dir: "/tmp/fsa/{{ now(utc=false, fmt='%Y%m%d_%H%M%S') }}"

  tasks:

    # ------------------------
    # 0. 작업 디렉토리 생성
    # ------------------------
    - name: Create work directory
      file:
        path: "{{ work_dir }}"
        state: directory

    # ------------------------
    # 1. ONTAP Volume 조회
    # ------------------------
    - name: Get volume information
      na_ontap_rest_cli:
        hostname: "{{ cluster.ip }}"
        username: "{{ cluster.ID }}"
        password: "{{ cluster.PW }}"
        https: true
        validate_certs: false
        verb: GET
        command: "volume"
        params:
          type: "{{ config.cli.type }}"
          total: "{{ config.cli.total }}"
          logical-used-percent: "{{ config.cli.LogicalUsedPercent }}"
          is-space-reporting-logical: true
          is-flexgroup: false
          analytics-state: "on"
          volume: "{{ config.cli.volumename }}"
          policy: "{{ config.cli.policy }}"
          fields: "vserver,volume,junction-path,analytics-state,policy,type,is-flexgroup,instance-uuid"
      register: ontap_volumes
      loop: "{{ clusters }}"
      loop_control:
        loop_var: cluster

    - name: Save volume JSON
      copy:
        dest: "{{ work_dir }}/volume.json"
        content: "{{ ontap_volumes.results | to_nice_json }}"

    - name: Save config YAML
      copy:
        dest: "{{ work_dir }}/config.yaml"
        content: "{{ config | to_nice_yaml }}"

    # ------------------------
    # 2. FSA.py 위치 찾기
    # ------------------------
    - name: Find FSA.py
      find:
        paths: "{{ scripts_dir }}"
        patterns: "fsa.py"
        recurse: yes
      register: fsa_script

    - name: Set script path
      set_fact:
        fsa_path: "{{ fsa_script.files[0].path }}"

    # ------------------------
    # 3. Scan Object 생성
    # ------------------------
    - name: Generate scan objects
      command: >
        python3 {{ fsa_path }}
        -r get_scan_object
        -f {{ work_dir }}/volume.json
        --config {{ work_dir }}/config.yaml
      register: scan_object

    - name: Save scan objects
      copy:
        dest: "{{ work_dir }}/scan_objects.yaml"
        content: "{{ scan_object.stdout }}"

    # ------------------------
    # 4. USER 디렉토리 탐색
    # ------------------------
    - name: Find USER directories
      command: >
        python3 {{ fsa_path }}
        -r find_dir
        -f {{ work_dir }}/scan_objects.yaml
      register: found_dirs

    - name: Save found dirs
      copy:
        dest: "{{ work_dir }}/found_dirs.yaml"
        content: "{{ found_dirs.stdout }}"

    # ------------------------
    # 5. Usage 조회
    # ------------------------
    - name: Get usage data
      command: >
        python3 {{ fsa_path }}
        -r get_usage
        -f {{ work_dir }}/found_dirs.yaml
      register: usage

    - name: Save usage
      copy:
        dest: "{{ work_dir }}/usage.yaml"
        content: "{{ usage.stdout }}"

    # ------------------------
    # 6. HTML 생성
    # ------------------------
    - name: Build HTML report
      command: >
        python3 {{ fsa_path }}
        -r build_mail
        -f {{ work_dir }}/usage.yaml
      register: html

    - name: Save HTML file
      copy:
        dest: "{{ work_dir }}/report.html"
        content: "{{ html.stdout }}"

    # ------------------------
    # 7. 이메일 발송
    # ------------------------
    - name: Send FSA report email
      mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        username: "{{ smtp_username }}"
        password: "{{ smtp_password }}"
        to: "{{ email_to }}"
        subject: "FSA Report - {{ now(utc=false,fmt='%Y.%m.%d') }}"
        body: "{{ html.stdout }}"
        from: "{{ email_from }}"
        secure: starttls
        subtype: html
      when: html.stdout is defined