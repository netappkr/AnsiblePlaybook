---
- name: Ontap File Lifecycle Managed (FSA v3)
  hosts: task_server_1_fsa
  gather_facts: no
  collections:
    - netapp.ontap

  vars:
    work_dir: "/tmp/fsa"

  tasks:

    # -------------------------
    # 작업 디렉토리 생성
    # -------------------------
    - name: Create work directory
      file:
        path: "{{ work_dir }}"
        state: directory
        mode: "0755"

    # -------------------------
    # ONTAP 볼륨 조회
    # -------------------------
    - name: Get volume information
      na_ontap_rest_cli:
        hostname: "{{ cluster.ip }}"
        username: "{{ cluster.ID }}"
        password: "{{ cluster.PW }}"
        https: true
        validate_certs: false
        verb: GET
        command: "volume"
        params:
          type: "{{ config.cli.type }}"
          total: "{{ config.cli.total }}"
          logical-used-percent: "{{ config.cli.LogicalUsedPercent }}"
          is-space-reporting-logical: true
          analytics-state: "on"
          volume: "{{ config.cli.volumename }}"
          policy: "{{ config.cli.policy }}"
          fields: "vserver,volume,junction-path,analytics-state,policy,type,is-flexgroup,instance-uuid"
      register: ontap_volumes
      loop: "{{ clusters }}"
      loop_control:
        loop_var: cluster

    # -------------------------
    # JSON 저장
    # -------------------------
    - name: Save volume JSON
      copy:
        dest: "{{ work_dir }}/volume.json"
        content: "{{ ontap_volumes.results | to_nice_json }}"

    # -------------------------
    # config 저장
    # -------------------------
    - name: Save config YAML
      copy:
        dest: "{{ work_dir }}/config.yaml"
        content: "{{ config | to_nice_yaml }}"

    # -------------------------
    # FSA.py 찾기
    # -------------------------
    - name: Find FSA.py
      find:
        paths: "{{ scripts_dir }}"
        patterns: "FSA.py"
        recurse: yes
        file_type: file
      register: fsa_script

    - name: Validate FSA.py exists
      fail:
        msg: "FSA.py not found"
      when: fsa_script.matched == 0

    - name: Set script path
      set_fact:
        fsa_path: "{{ fsa_script.files[0].path }}"

    # -------------------------
    # scan_object 생성
    # -------------------------
    - name: Generate scan_objects
      command: >
        python3 {{ fsa_path }}
        -r get_scan_object
        --config {{ work_dir }}/config.yaml
        -f {{ work_dir }}/volume.json
      register: scan_objects

    - name: Save scan_objects YAML
      copy:
        dest: "{{ work_dir }}/scan_objects.yaml"
        content: "{{ scan_objects.stdout }}"

    # -------------------------
    # usage 수집 (핵심)
    # -------------------------
    - name: Collect usage
      command: >
        python3 {{ fsa_path }}
        -r find_and_collect_usage
        -f {{ work_dir }}/scan_objects.yaml
        --prevfile {{ work_dir }}/usage_latest.yaml
      register: usage_result

    - name: Save usage YAML
      copy:
        dest: "{{ work_dir }}/usage_latest.yaml"
        content: "{{ usage_result.stdout }}"

    - name: Get current timestamp
      command: date +%Y%m%d_%H%M%S
      register: current_time

    - name: Save usage history YAML
      copy:
        dest: "{{ work_dir }}/usage_{{ current_time.stdout }}.yaml"
        content: "{{ usage_result.stdout }}"
    # -------------------------ß
    # HTML 생성 (수정)
    # -------------------------
    - name: Build HTML report
      command: >
        python3 {{ fsa_path }}
        -r build_all_mail
        -f {{ work_dir }}/usage.yaml
      register: mail_result

    - name: Save mail_result YAML
      copy:
        dest: "{{ work_dir }}/mail.yaml"
        content: "{{ mail_result.stdout }}"

    # -------------------------
    # 결과 파싱
    # -------------------------
    - name: Parse mail result
      set_fact:
        mail_data: "{{ mail_result.stdout | from_yaml }}"

    - debug:
        var: mail_data
    # -------------------------
    # 관리자 메일 발송
    # -------------------------
    - name: send admin mail
      mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        username: "{{ smtp_username }}"
        password: "{{ smtp_password }}"
        to: "{{ email_to }}"
        subject: "[FSA] 전체 사용량 리포트"
        subtype: html
        body: "{{ mail_data.total_html }}"
        from: "{{ email_from }}"
        secure: starttls

    # -------------------------
    # 사용자별 메일 발송
    # -------------------------
    - name: Send usage report mail per user
      mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        username: "{{ smtp_username }}"
        password: "{{ smtp_password }}"
        to: "{{ item.email }}"
        subject: "[FSA] 개인 사용량 리포트"
        body: "{{ item.html }}"
        from: "{{ email_from }}"
        secure: starttls
        subtype: html
        headers:
          - Content-Type="text/html"
      loop: "{{ mail_data.users }}"
      when: item.email != "unknown" and item.email != ""