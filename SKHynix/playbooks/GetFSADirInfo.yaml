---
- name: Ontap File Lifecycle Managed (FSA v3)
  hosts: task_server_1_fsa
  gather_facts: no
  collections:
    - netapp.ontap

  vars:
    work_dir: "/tmp/fsa"

  tasks:
    - name: Get current date
      command: date +%Y-%m-%d
      register: current_date

    - name: Set work directory with today
      set_fact:
        today_dir: "{{ work_dir }}/{{ current_date.stdout }}"

    - name: Get yesterday date
      command: date -d "yesterday" +%Y-%m-%d
      register: yesterday_date

    - name: Set work directory with yesterday
      set_fact:
        yesterday_dir: "{{ work_dir }}/{{ yesterday_date.stdout }}"

    # -------------------------
    # 작업 디렉토리 생성
    # -------------------------
    - name: Create work directory
      file:
        path: "{{ today_dir }}"
        state: directory
        mode: "0755"

    # -------------------------
    # ONTAP 볼륨 조회
    # -------------------------
    - name: Get volume information
      na_ontap_rest_cli:
        hostname: "{{ cluster.ip }}"
        username: "{{ cluster.ID }}"
        password: "{{ cluster.PW }}"
        https: true
        validate_certs: false
        verb: GET
        command: "volume"
        params:
          type: "{{ config.cli.type }}"
          total: "{{ config.cli.total }}"
          logical-used-percent: "{{ config.cli.LogicalUsedPercent }}"
          is-space-reporting-logical: true
          analytics-state: "on"
          volume: "{{ config.cli.volumename }}"
          policy: "{{ config.cli.policy }}"
          fields: "vserver,volume,junction-path,analytics-state,policy,type,is-flexgroup,instance-uuid"
      register: ontap_volumes
      loop: "{{ clusters }}"
      loop_control:
        loop_var: cluster

    # -------------------------
    # JSON 저장
    # -------------------------
    - name: Save volume JSON
      copy:
        dest: "{{ today_dir }}/volume.json"
        content: "{{ ontap_volumes.results | to_nice_json }}"

    # -------------------------
    # config 저장
    # -------------------------
    - name: Save config YAML
      copy:
        dest: "{{ today_dir }}/config.yaml"
        content: "{{ config | to_nice_yaml }}"

    # -------------------------
    # FSA.py 찾기
    # -------------------------
    - name: Find FSA.py
      find:
        paths: "{{ scripts_dir }}"
        patterns: "FSA.py"
        recurse: yes
        file_type: file
      register: fsa_script

    - name: Validate FSA.py exists
      fail:
        msg: "FSA.py not found"
      when: fsa_script.matched == 0

    - name: Set script path
      set_fact:
        fsa_path: "{{ fsa_script.files[0].path }}"

    # -------------------------
    # getauto auto.{{division}}
    # -------------------------
    - name: Run getauto per division
      command: "getauto auto.{{ item.autopath.automap }}"
      register: auto_result
      loop: "{{ config.division }}"

    - name: Save getauto raw result
      copy:
        dest: "{{ today_dir }}/auto_raw.json"
        content: "{{ auto_result.results | to_nice_json }}"

    - name: Convert getauto → YAML
      command: >
        python3 {{ fsa_path }}
        -r build_auto_yaml
        -f {{ today_dir }}/auto_raw.json
      register: auto_yaml

    - name: Save auto_db.yaml
      copy:
        dest: "{{ today_dir }}/auto_db.yaml"
        content: "{{ auto_yaml.stdout }}"
    # -------------------------
    # scan_object 생성
    # -------------------------
    - name: Generate scan_objects
      command: >
        python3 {{ fsa_path }}
        -r get_scan_object
        --config {{ today_dir }}/config.yaml
        -f {{ today_dir }}/volume.json
        --auto-db {{ today_dir }}/auto_db.yaml
      register: scan_objects

    - name: Save scan_objects YAML
      copy:
        dest: "{{ today_dir }}/scan_objects.yaml"
        content: "{{ scan_objects.stdout }}"

    # -------------------------
    # usage 수집 (핵심)
    # -------------------------
    - name: Collect usage
      command: >
        python3 {{ fsa_path }}
        -r find_and_collect_usage
        -f {{ today_dir }}/scan_objects.yaml
        --prevfile {{ yesterday_dir }}/usage_latest.yaml
      register: usage_result

    - name: Save usage YAML
      copy:
        dest: "{{ today_dir }}/usage_latest.yaml"
        content: "{{ usage_result.stdout }}"

    - name: Get current timestamp
      command: date +%Y%m%d_%H%M%S
      register: current_time

    - name: Save usage history YAML
      copy:
        dest: "{{ today_dir }}/usage_{{ current_time.stdout }}.yaml"
        content: "{{ usage_result.stdout }}"
    # -------------------------ß
    # HTML 생성 (수정)
    # -------------------------
    - name: Build HTML report
      command: >
        python3 {{ fsa_path }}
        -r build_mail
        -f {{ today_dir }}/usage_latest.yaml
      register: mail_result

    - name: Save mail_result YAML
      copy:
        dest: "{{ today_dir }}/mail.yaml"
        content: "{{ mail_result.stdout }}"

    # -------------------------
    # 결과 파싱
    # -------------------------
    - name: Parse mail result
      set_fact:
        mail_list: "{{ mail_result.stdout | from_yaml }}"


    # -------------------------
    #  메일 발송
    # -------------------------
    - name: Send volume mail
      mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        #username: "{{ smtp_username }}"
        #password: "{{ smtp_password }}"
        to: "{{ ([email_to] + item.emails) | join(',') }}"
        #to: "{{ email_to }}"
        subject: "[Data Size Info Mail] {{ item.subject }} Project User Directory Used Size"
        subtype: html
        body: "{{ item.html }}"
        from: "{{ email_from }}"
        # secure: never
        secure: starttls
      loop: "{{ mail_list }}"


